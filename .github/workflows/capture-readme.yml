name: Refresh AURA README screenshot

on:
  push:
    branches: [main]
    paths:
      - "AURA_demo_UI/**"
      - ".github/workflows/capture-readme.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aura-readme-screenshot
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AURA
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install screenshot tooling
        run: pip install playwright==1.55.0

      - name: Capture the actual AURA Atlas home screen
        run: |
          mkdir -p assets
          python - <<'PY'
          import os, shutil, subprocess, time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          server = subprocess.Popen(
              ["python", "-m", "http.server", "5500", "-d", "AURA_demo_UI", "--bind", "127.0.0.1"],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          )
          try:
              time.sleep(1.5)
              executable = (
                  shutil.which("google-chrome")
                  or shutil.which("google-chrome-stable")
                  or shutil.which("chromium")
              )
              if not executable:
                  subprocess.run(["python", "-m", "playwright", "install", "chromium"], check=True)
              with sync_playwright() as playwright:
                  browser = playwright.chromium.launch(
                      headless=True,
                      executable_path=executable,
                      args=["--no-sandbox", "--disable-dev-shm-usage"],
                  )
                  page = browser.new_page(
                      viewport={"width": 1600, "height": 930},
                      device_scale_factor=1.5,
                  )
                  response = page.goto(
                      "http://127.0.0.1:5500/",
                      wait_until="domcontentloaded",
                      timeout=20000,
                  )
                  if response is None or response.status != 200:
                      raise RuntimeError(f"Local AURA preview failed: {response}")
                  page.wait_for_timeout(2000)
                  heading = page.locator("h1").first.inner_text()
                  if "Research" not in heading:
                      raise RuntimeError(f"Unexpected homepage: {heading}")
                  page.screenshot(
                      path="assets/aura-atlas-dashboard.png",
                      full_page=False,
                      animations="disabled",
                  )
                  browser.close()
                  print("Captured AURA home screen:", heading)
                  print("Image size:", Path("assets/aura-atlas-dashboard.png").stat().st_size)
          finally:
              server.terminate()
              server.wait(timeout=5)
          PY

      - name: Save screenshot to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/aura-atlas-dashboard.png
          if git diff --cached --quiet; then
            echo "Screenshot unchanged"
          else
            git commit -m "docs: refresh actual AURA dashboard screenshot"
            git push
          fi
