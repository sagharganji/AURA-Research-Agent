name: Deploy AURA Atlas to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "AURA_demo_UI/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload only the static frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: AURA_demo_UI

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
